<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sanatan New Zealand</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Connect with the Hindu community in New Zealand. Find temples, join events, and grow spiritually together.">
  <meta name="keywords" content="Hindu, New Zealand, temples, community, events, festivals, spiritual">
  <meta name="author" content="Sanatan New Zealand">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Sanatan New Zealand - Hindu Community Platform">
  <meta property="og:description" content="Your spiritual home in Aotearoa. Connect with temples, join festivals, and build meaningful relationships.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sanatannewzealand.org">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sanatan New Zealand - Hindu Community Platform">
  <meta name="twitter:description" content="Your spiritual home in Aotearoa. Connect with temples, join festivals, and build meaningful relationships.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Theme Color -->
  <meta name="theme-color" content="#f97316">
  <meta name="msapplication-TileColor" content="#f97316">

  <!-- Preload Critical Resources -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" as="style">
</head>
<body class="antialiased">
  
  <!-- App Root -->
  <app-root></app-root>


  <!-- Loading Script -->
  <script>
    // Show loading indicator
    document.addEventListener('DOMContentLoaded', function() {
      const loadingElement = document.querySelector('app-loading');
      if (loadingElement) {
        setTimeout(() => {
          loadingElement.style.display = 'none';
        }, 2000);
      }
    });
  </script>
</body>
</html>
